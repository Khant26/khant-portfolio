# Generated by Sawyun project IDE for the deploy target "portfolio-web (Google VM)".
# You can edit it; Sawyun project IDE only relies on the file name and the image_tag input.
name: Deploy portfolio-web (Google VM)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (commit SHA) to deploy. Leave empty to build and deploy this commit."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-portfolio-web-google-vm
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/khant26/portfolio-web

jobs:
  build:
    if: ${{ github.event_name == 'push' || inputs.image_tag == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/cicd-helper/portfolio-web-google-vm.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
  deploy:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on the server
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.CICD_PORTFOLIO_WEB_GOOGLE_VM_HOST }}
          port: ${{ secrets.CICD_PORTFOLIO_WEB_GOOGLE_VM_PORT }}
          username: ${{ secrets.CICD_PORTFOLIO_WEB_GOOGLE_VM_USER }}
          key: ${{ secrets.CICD_PORTFOLIO_WEB_GOOGLE_VM_SSH_KEY }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd /srv/portfolio-web
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export IMAGE_TAG
            docker compose pull web
            docker compose up -d web
            docker logout ghcr.io
            echo "Deployed ghcr.io/khant26/portfolio-web:$IMAGE_TAG"
      - name: Check the container answers
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CICD_PORTFOLIO_WEB_GOOGLE_VM_HOST }}
          port: ${{ secrets.CICD_PORTFOLIO_WEB_GOOGLE_VM_PORT }}
          username: ${{ secrets.CICD_PORTFOLIO_WEB_GOOGLE_VM_USER }}
          key: ${{ secrets.CICD_PORTFOLIO_WEB_GOOGLE_VM_SSH_KEY }}
          script: |
            for i in 1 2 3 4 5 6; do
              if docker exec proxy-caddy-1 wget -qO /dev/null http://portfolio-web/; then echo "healthy"; exit 0; fi
              sleep 5
            done
            echo "portfolio-web did not answer"; exit 1
